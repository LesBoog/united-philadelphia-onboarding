<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Dashboard | United Real Estate Philadelphia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1D36;
    --blue: #1A56DB;
    --blue-light: #3B82F6;
    --blue-soft: #EFF6FF;
    --gray-50: #F8FAFC;
    --gray-100: #F1F5F9;
    --gray-200: #E2E8F0;
    --gray-300: #CBD5E1;
    --gray-500: #64748B;
    --gray-700: #334155;
    --gray-900: #0F172A;
    --success: #10B981;
    --radius: 12px;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--gray-900);
    background: var(--gray-50);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 2rem 1.25rem 4rem;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .section-label {
    display: inline-block; font-size: 0.75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--blue); margin-bottom: 0.5rem;
  }
  h1 {
    font-size: clamp(1.75rem, 4vw, 2.5rem);
    font-weight: 800; letter-spacing: -0.02em;
    margin-bottom: 0.75rem; color: var(--navy);
  }
  .section-desc {
    color: var(--gray-500); font-size: 1.05rem;
    max-width: 600px; margin-bottom: 2rem;
  }
  .progress-bar-wrap {
    background: white; border: 1px solid var(--gray-200);
    border-radius: var(--radius); padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem; box-shadow: var(--shadow);
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 0.9rem; font-weight: 600; margin-bottom: 0.6rem;
  }
  .progress-track {
    height: 10px; background: var(--gray-200); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue), var(--blue-light));
    border-radius: 999px; transition: width 0.4s ease; width: 0%;
  }
  .steps { display: grid; gap: 0.85rem; }
  .step {
    background: white; border: 1px solid var(--gray-200);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow);
  }
  .step-header {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.1rem 1.35rem; cursor: pointer;
    user-select: none;
  }
  .step-header:hover { background: var(--gray-50); }
  .step-num {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--blue-soft); color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; flex-shrink: 0;
  }
  .step.completed .step-num { background: var(--success); color: white; }
  .step-title { flex: 1; font-weight: 700; font-size: 1rem; color: var(--navy); }
  .step-pct { font-size: 0.8rem; color: var(--gray-500); font-weight: 600; }
  .step-body {
    display: none; padding: 0 1.35rem 1.35rem;
    border-top: 1px solid var(--gray-100);
  }
  .step.open .step-body { display: block; }
  .checklist { list-style: none; margin: 1rem 0; }
  .checklist li {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.55rem 0; font-size: 0.95rem;
  }
  .checklist input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--blue); cursor: pointer;
  }
  .resources {
    background: var(--blue-soft); border-radius: 8px;
    padding: 0.85rem 1rem; margin: 0.75rem 0; font-size: 0.875rem;
    color: var(--gray-700);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0.55rem 1.2rem; border-radius: 8px;
    font-weight: 600; font-size: 0.875rem; cursor: pointer;
    border: none; background: var(--blue); color: white;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--blue-light); }
  .header-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem; padding-bottom: 1rem;
    border-bottom: 1px solid var(--gray-200);
  }
  .logo { font-weight: 800; font-size: 1.1rem; color: var(--navy); }
  .logo span { color: var(--blue); }
</style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="logo">United <span>Philadelphia</span></div>
      <div style="font-size:0.85rem;color:var(--gray-500);font-weight:500">Agent Onboarding Portal</div>
    </div>
    <span class="section-label">Your Path to Production</span>
    <h1>Onboarding Center</h1>
    <p class="section-desc">Track your progress from day one. Complete each step at your own pace. Continue where you left off.</p>
    <div class="progress-bar-wrap">
      <div class="progress-label">
        <span>Your onboarding is <strong id="overallPct">0%</strong> complete</span>
        <span id="stepsDone">0 / 7 steps</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="steps" id="onboardingSteps"></div>
    <p style="margin-top:2rem;font-size:0.85rem;color:var(--gray-500)">For the full portal, open <a href="united-onboarding.html">united-onboarding.html</a>.</p>
  </div>
<script>
  const onboardingSteps = [
    { id: 1, title: "License & Compliance", items: ["Confirm active Pennsylvania real estate license", "Submit license documentation", "Complete any required compliance acknowledgments"], resources: "Contact your broker for license transfer guidance." },
    { id: 2, title: "Brokerage Documents", items: ["Review independent contractor agreement", "Sign affiliation paperwork", "Complete W-9 and required forms"], resources: "Documents provided by brokerage administration." },
    { id: 3, title: "MLS & Associations", items: ["Join or transfer local MLS membership", "Complete association applications", "Obtain MLS credentials"], resources: "Brokerage will assist with MLS and association setup." },
    { id: 4, title: "Technology Setup", items: ["Activate Bullseye CRM account", "Set up transaction management access", "Configure email and login credentials"], resources: "Tech setup guides available after affiliation." },
    { id: 5, title: "Marketing Setup", items: ["Launch agent website", "Create professional profile photos/bios", "Set up social media business presence"], resources: "Website included in $69/mo technology package." },
    { id: 6, title: "Lead Generation", items: ["Review available lead programs", "Configure lead routing preferences", "Learn CRM lead follow-up workflows"], resources: "Zillow Premier opportunities where available." },
    { id: 7, title: "Business Launch", items: ["Import sphere of influence contacts", "Announce your new affiliation", "Schedule first training session", "Set 30-day activity goals"], resources: "See First 30 Days plan for weekly milestones." }
  ];
  let progress = {};
  function renderSteps() {
    const container = document.getElementById('onboardingSteps');
    container.innerHTML = '';
    onboardingSteps.forEach((step) => {
      const stepKey = 'step' + step.id;
      const checked = progress[stepKey] || [];
      const pct = Math.round((checked.length / step.items.length) * 100);
      const isComplete = pct === 100;
      const isOpen = progress.openStep === step.id;
      const el = document.createElement('div');
      el.className = 'step' + (isComplete ? ' completed' : '') + (isOpen ? ' open' : '');
      el.innerHTML = `<div class="step-header" onclick="toggleStep(${step.id})"><div class="step-num">${isComplete ? '✓' : step.id}</div><div class="step-title">STEP ${step.id} — ${step.title}</div><div class="step-pct">${pct}%</div></div><div class="step-body"><ul class="checklist">${step.items.map((item, i) => `<li><input type="checkbox" id="s${step.id}i${i}" ${checked.includes(i) ? 'checked' : ''} onchange="toggleItem(${step.id}, ${i})"><label for="s${step.id}i${i}">${item}</label></li>`).join('')}</ul><div class="resources"><strong>Resources:</strong> ${step.resources}</div><button class="btn" onclick="markStepComplete(${step.id})">${isComplete ? 'Completed ✓' : 'Mark Complete'}</button></div>`;
      container.appendChild(el);
    });
    updateOverallProgress();
  }
  function toggleStep(id) { progress.openStep = progress.openStep === id ? null : id; renderSteps(); }
  function toggleItem(stepId, itemIdx) { const key = 'step' + stepId; if (!progress[key]) progress[key] = []; const arr = progress[key]; const pos = arr.indexOf(itemIdx); if (pos > -1) arr.splice(pos, 1); else arr.push(itemIdx); renderSteps(); }
  function markStepComplete(stepId) { const step = onboardingSteps.find(s => s.id === stepId); progress['step' + stepId] = step.items.map((_, i) => i); renderSteps(); }
  function updateOverallProgress() { let totalItems = 0, doneItems = 0; onboardingSteps.forEach(step => { totalItems += step.items.length; const checked = progress['step' + step.id] || []; doneItems += checked.length; }); const pct = totalItems ? Math.round((doneItems / totalItems) * 100) : 0; document.getElementById('overallPct').textContent = pct + '%'; document.getElementById('progressFill').style.width = pct + '%'; const completedSteps = onboardingSteps.filter(s => { const c = progress['step' + s.id] || []; return c.length === s.items.length; }).length; document.getElementById('stepsDone').textContent = completedSteps + ' / 7 steps'; }
  progress.openStep = 1; renderSteps();
</script>
</body>
</html>
