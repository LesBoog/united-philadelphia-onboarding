<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>United Real Estate Philadelphia | Loading…</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0A2540; color: #fff;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { text-align: center; }
  .spin { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.2);
           border-top-color: #635BFF; border-radius: 50%; animation: s .7s linear infinite;
           margin: 0 auto 1rem; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #A5B4FC; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p>Loading United Real Estate Philadelphia portal…</p>
</div>
<script>
(async () => {
  try {
    const n = 11;
    let html = '';
    for (let i = 0; i < n; i++) {
      const r = await fetch('portal_part_' + i + '.txt');
      if (!r.ok) throw new Error('Missing portal_part_' + i + '.txt (' + r.status + ')');
      html += await r.text();
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><p style="color:#f87171">Could not load portal.</p><p style="font-size:0.9rem;color:#94a3b8">' + e.message + '</p><p><a href="onboarding-dashboard.html">Open onboarding dashboard</a></p></div>';
  }
})();
</script>
</body>
</html>
